<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Rencontres - Rencontres</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .nav-btn {
            background: white;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .nav-btn:hover { transform: translateY(-2px); }
        
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stats-card h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stats-number {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .user-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: white;
            margin: 0 auto 15px;
        }
        
        .user-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .user-bio {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .user-location {
            color: #888;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .interest-tag {
            background: #eef2ff;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .empty-state {
            background: white;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        
        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .empty-state a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤝 Mes Rencontres</h1>
            <p>Toutes les personnes que j'ai rencontrées</p>
        </div>
        
        <div class="nav-buttons">
            <a href="/search" class="nav-btn">← Rechercher des utilisateurs</a>
        </div>
        
        <div class="stats-card">
            <h2>Nombre total de rencontres</h2>
            <div class="stats-number" id="meetingsCount">0</div>
        </div>
        
        <div id="usersContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🔄</div>
                <h2>Chargement...</h2>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;

        async function initPage() {
            try {
                // Vérifier l'authentification
                const authResp = await fetch('/api/auth/check');
                if (!authResp.ok) {
                    window.location.href = '/';
                    return;
                }
                const authData = await authResp.json();
                currentUserId = authData.userId;

                // Charger les rencontres
                loadMeetings();
            } catch (error) {
                console.error('Erreur auth:', error);
                window.location.href = '/';
            }
        }

        async function loadMeetings() {
            try {
                const response = await fetch(`/api/users/${currentUserId}/meetings`);
                
                if (response.ok) {
                    const users = await response.json();
                    displayMeetings(users);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError();
            }
        }

        function displayMeetings(users) {
            const container = document.getElementById('usersContainer');
            const countElement = document.getElementById('meetingsCount');
            
            countElement.textContent = users.length;
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">😔</div>
                        <h2>Aucune rencontre pour le moment</h2>
                        <p>Commencez à rencontrer des personnes pour les voir apparaître ici !</p>
                        <a href="/search">Découvrir des utilisateurs</a>
                    </div>
                `;
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'users-grid';
            
            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.onclick = () => window.location.href = `/detail/${user.id}`;
                
                const interestsHtml = user.interests && user.interests.length > 0
                    ? `<div class="interests">
                        ${user.interests.map(interest => 
                            `<span class="interest-tag">${interest}</span>`
                        ).join('')}
                    </div>`
                    : '';
                
                const locationHtml = user.localisation 
                    ? `<div class="user-location">📍 ${user.localisation}</div>`
                    : '';
                
                card.innerHTML = `
                    <div class="avatar-placeholder">👤</div>
                    <div class="user-name">${user.username}</div>
                    <div class="user-bio">${user.bio || 'Aucune bio'}</div>
                    ${locationHtml}
                    ${interestsHtml}
                `;
                
                grid.appendChild(card);
            });
            
            container.innerHTML = '';
            container.appendChild(grid);
        }

        function showError() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">❌</div>
                    <h2>Erreur de chargement</h2>
                    <p>Impossible de charger vos rencontres.</p>
                    <a href="/search">Retour à la recherche</a>
                </div>
            `;
        }

        // Chargement au démarrage
        initPage();
    </script>
</body>
</html>
