<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .results {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .user-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .user-card p {
            color: #666;
            margin: 8px 0;
            line-height: 1.6;
        }

        .user-card strong {
            color: #333;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ Plateforme de Rencontres</h1>

        <div class="content">
            <!-- FORMULAIRE CRÉATION UTILISATEUR -->
            <div class="card">
                <h2>📝 Créer un Utilisateur</h2>
                <div id="createAlert" class="alert"></div>
                <form id="createUserForm">
                    <div class="form-group">
                        <label for="username">Nom d'utilisateur</label>
                        <input type="text" id="username" name="username" required
                               placeholder="Entrez votre nom d'utilisateur">
                    </div>

                    <div class="form-group">
                        <label for="bio">Biographie</label>
                        <textarea id="bio" name="bio" required
                                  placeholder="Parlez-nous de vous..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="interests">Centres d'intérêt (séparés par des virgules)</label>
                        <input type="text" id="interests" name="interests" required
                               placeholder="ex: Voyages, Lecture, Musique, Sport">
                    </div>

                    <div class="form-group">
                        <label for="localisation">Ville: </label>
                        <input type="text" id="localisation" name="localisation" required
                               placeholder="ex: Paris, Lyon, Marseille">
                    </div>

                    <button type="submit">Créer le Profil</button>
                </form>
            </div>

            <!-- FORMULAIRE RECHERCHE -->
            <div class="card">
                <h2>🔍 Rechercher</h2>
                <div id="searchAlert" class="alert"></div>
                <form id="searchForm">
                    <div class="form-group">
                        <label for="searchType">Filtrer par</label>
                        <select id="searchType" name="searchType">
                            <option value="interest" selected>Centre d'intérêt</option>
                            <option value="localisation">Ville</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="searchLabel" for="searchQuery">Centre d'intérêt</label>
                        <input type="text" id="searchQuery" name="searchQuery" required
                               placeholder="ex: Musique, Sport, Voyage...">
                    </div>

                    <button type="submit">Rechercher</button>
                </form>
            </div>
        </div>

        <!-- AFFICHAGE DES RÉSULTATS -->
        <div class="results">
            <h2>📋 Résultats</h2>
            <div id="resultContainer">
                <p class="no-results">Aucune recherche effectuée</p>
            </div>
        </div>
    </div>

    <script>
        // Création d'un utilisateur
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const bio = document.getElementById('bio').value.trim();
            const interestsStr = document.getElementById('interests').value.trim();
            const interests = interestsStr.split(',').map(i => i.trim()).filter(i => i);
            const localisation = document.getElementById('localisation').value.trim();

            if (interests.length === 0) {
                showAlert('createAlert', 'Veuillez entrer au moins un centre d\'intérêt', 'error');
                return;
            }
            if (!localisation) {
                showAlert('createAlert', 'Veuillez entrer une ville', 'error');
                return;
            }

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        bio,
                        interests,
                        localisation
                    })
                });

                if (response.ok) {
                    const user = await response.json();
                    showAlert('createAlert', `✅ Utilisateur "${username}" créé avec succès!`, 'success');
                    document.getElementById('createUserForm').reset();
                } else {
                    const error = await response.json();
                    showAlert('createAlert', `❌ Erreur: ${error.message || 'Impossible de créer l\'utilisateur'}`, 'error');
                }
            } catch (error) {
                showAlert('createAlert', `❌ Erreur réseau: ${error.message}`, 'error');
            }
        });

        // Mise à jour du placeholder selon le type
        document.getElementById('searchType').addEventListener('change', (e) => {
            const type = e.target.value;
            const label = document.getElementById('searchLabel');
            const input = document.getElementById('searchQuery');
            if (type === 'localisation') {
                label.textContent = 'Ville';
                input.placeholder = 'ex: Paris, Lyon, Marseille...';
            } else {
                label.textContent = "Centre d'intérêt";
                input.placeholder = 'ex: Musique, Sport, Voyage...';
            }
        });

        // Recherche par centre d'intérêt ou par ville
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const type = document.getElementById('searchType').value;
            const query = document.getElementById('searchQuery').value.trim();

            if (!query) {
                showAlert('searchAlert', type === 'localisation' ? 'Veuillez entrer une ville' : 'Veuillez entrer un centre d\'intérêt', 'error');
                return;
            }

            try {
                const paramName = type === 'localisation' ? 'localisation' : 'interest';
                const response = await fetch(`/api/users/search?${paramName}=${encodeURIComponent(query)}`);

                if (response.ok) {
                    const users = await response.json();
                    displayResults(users, query, type);
                } else {
                    showAlert('searchAlert', 'Erreur lors de la recherche', 'error');
                }
            } catch (error) {
                showAlert('searchAlert', `Erreur réseau: ${error.message}`, 'error');
            }
        });

        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        }

        function displayResults(users, searchTerm, type) {
            const resultContainer = document.getElementById('resultContainer');

            if (users.length === 0) {
                resultContainer.innerHTML = `
                    <p class="no-results">
                        Aucun utilisateur trouvé avec ${type === 'localisation' ? 'la ville' : "le centre d'intérêt"}: <strong>"${searchTerm}"</strong>
                    </p>
                `;
                return;
            }

            let html = `<p style="color: #667eea; margin-bottom: 20px; font-weight: 600;">
                        ${users.length} utilisateur(s) trouvé(s) pour ${type === 'localisation' ? 'la ville' : "le centre d'intérêt"}: <strong>"${searchTerm}"</strong>
                    </p>
                    <div class="users-grid">`;

            users.forEach(user => {
                // Note le bouton ajouté en bas de la carte
                html += `
                    <div class="user-card">
                        <h3>👤 ${user.username}</h3>
                        <p><strong>Bio:</strong> ${user.bio}</p>
                        <p><strong>Intérêts:</strong> ${user.interests.join(', ')}</p>
                        ${user.localisation ? `<p><strong>Ville:</strong> ${user.localisation}</p>` : ''}
                        
                        <a href="/users/detail/${user.id}" 
                           style="display:block; text-align:center; margin-top:15px; background:#667eea; color:white; padding:8px; border-radius:5px; text-decoration:none; font-weight:bold;">
                           Rencontrer 🤝
                        </a>
                    </div>
                `;
            });

            html += '</div>';
            resultContainer.innerHTML = html;
        }
    </script>
</body>
</html>
