<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche - Rencontres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* --- MODIFICATION ICI : Styles interactifs pour le badge --- */
        .score-badge {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 5px;
            
            /* Rendre le badge cliquable */
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .score-badge:hover {
            transform: scale(1.05); /* Effet de zoom */
            background: white;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        /* --------------------------------------------------------- */

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .user-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .user-card p {
            color: #666;
            margin: 8px 0;
            line-height: 1.6;
        }

        .user-card strong {
            color: #333;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Rechercher des utilisateurs</h1>
            
            <div class="header-actions">
                <a href="/meetings-history" class="score-badge" title="Mes rencontres" style="background: rgba(255,255,255,0.9); margin-right: 10px;">
                    🤝 Rencontres
                </a>
                
                <a href="/statistics" class="score-badge" title="Statistiques" style="background: rgba(255,255,255,0.9); margin-right: 10px;">
                    📊 Stats
                </a>
                
                <a href="/leaderboard" id="scoreBadge" class="score-badge" title="Voir le Top 10">
                    🏆 <span id="userPoints">...</span> pts
                </a>
                
                <button class="logout-btn" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <div class="card">
            <h2>Filtres de recherche</h2>
            <div id="searchAlert" class="alert"></div>
            <form id="searchForm">
                <div class="form-group">
                    <label for="searchType">Filtrer par</label>
                    <select id="searchType" name="searchType">
                        <option value="interest" selected>Centre d'intérêt</option>
                        <option value="localisation">Ville</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="searchLabel" for="searchQuery">Centre d'intérêt</label>
                    <input type="text" id="searchQuery" name="searchQuery" required
                           placeholder="ex: Musique, Sport, Voyage...">
                </div>

                <button type="submit">Rechercher</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Résultats</h2>
            <div id="resultContainer">
                <p class="no-results">Aucune recherche effectuée</p>
            </div>
        </div>
    </div>

    <script>
        // Vérifier si connecté au chargement + Charger les points
        async function initPage() {
            try {
                // 1. Vérifier Auth
                const authResp = await fetch('/api/auth/check');
                if (!authResp.ok) {
                    window.location.href = '/';
                    return;
                }
                const authData = await authResp.json();

                // 2. Charger les points (Redis)
                loadUserPoints(authData.userId);

            } catch (error) {
                window.location.href = '/';
            }
        }

        // Fonction pour récupérer les points depuis Redis
        async function loadUserPoints(userId) {
            try {
                const pointsResp = await fetch(`/api/points/${userId}`);
                if (pointsResp.ok) {
                    const points = await pointsResp.json();
                    document.getElementById('userPoints').textContent = points || 0;
                }
            } catch (e) {
                console.error("Erreur chargement points", e);
                document.getElementById('userPoints').textContent = "?";
            }
        }

        // Lancer l'initialisation
        initPage();

        // Déconnexion
        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }

        // Mise à jour du placeholder selon le type
        document.getElementById('searchType').addEventListener('change', (e) => {
            const type = e.target.value;
            const label = document.getElementById('searchLabel');
            const input = document.getElementById('searchQuery');
            if (type === 'localisation') {
                label.textContent = 'Ville';
                input.placeholder = 'ex: Paris, Lyon, Marseille...';
            } else {
                label.textContent = "Centre d'intérêt";
                input.placeholder = 'ex: Musique, Sport, Voyage...';
            }
        });

        // Recherche
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const type = document.getElementById('searchType').value;
            const query = document.getElementById('searchQuery').value.trim();

            if (!query) {
                showAlert(type === 'localisation' ? 'Veuillez entrer une ville' : 'Veuillez entrer un centre d\'intérêt');
                return;
            }

            try {
                const paramName = type === 'localisation' ? 'localisation' : 'interest';
                const response = await fetch(`/api/users/search?${paramName}=${encodeURIComponent(query)}`);

                if (response.ok) {
                    const users = await response.json();
                    displayResults(users, query, type);
                } else {
                    showAlert('Erreur lors de la recherche');
                }
            } catch (error) {
                showAlert(`Erreur réseau: ${error.message}`);
            }
        });

        function showAlert(message) {
            const alert = document.getElementById('searchAlert');
            alert.textContent = message;
            alert.className = 'alert error';
            alert.style.display = 'block';
        }

        function displayResults(users, searchTerm, type) {
            const resultContainer = document.getElementById('resultContainer');

            if (users.length === 0) {
                resultContainer.innerHTML = `
                    <p class="no-results">
                        Aucun utilisateur trouvé avec ${type === 'localisation' ? 'la ville' : "le centre d'intérêt"}: <strong>"${searchTerm}"</strong>
                    </p>
                `;
                return;
            }

            let html = `<p style="color: #667eea; margin-bottom: 20px; font-weight: 600;">
                        ${users.length} utilisateur(s) trouvé(s) pour ${type === 'localisation' ? 'la ville' : "le centre d'intérêt"}: <strong>"${searchTerm}"</strong>
                    </p>
                    <div class="users-grid">`;

            users.forEach(user => {
                html += `
                    <div class="user-card">
                        <h3>👤 ${user.username}</h3>
                        <p><strong>Bio:</strong> ${user.bio}</p>
                        <p><strong>Intérêts:</strong> ${user.interests.join(', ')}</p>
                        ${user.localisation ? `<p><strong>Ville:</strong> ${user.localisation}</p>` : ''}
                        
                        <a href="/users/detail/${user.id}" 
                           style="display:block; text-align:center; margin-top:15px; background:#667eea; color:white; padding:8px; border-radius:5px; text-decoration:none; font-weight:bold;">
                           Rencontrer 🤝
                        </a>
                    </div>
                `;
            });

            html += '</div>';
            resultContainer.innerHTML = html;
        }
    </script>
</body>
</html>
