version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: projet_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data  # volume pour persister les données

  mongodb:
    image: mongo:latest
    container_name: projet_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db  # volume pour persister les données

  redis:
    image: redis:latest
    container_name: projet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # volume pour persister les données

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: projet_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false # Ajoutez ceci
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:  # Déclaration des volumes
  mongodb_data:
  neo4j_data:
  redis_data:
  elasticsearch_data: